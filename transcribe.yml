name: Transcribe courses

on:
  workflow_dispatch:
    inputs:
      links_file:
        description: 'Имя файла в links/ (например course1.txt) или "all" — обработать все курсы подряд'
        required: true
        default: 'all'

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # ~5.5 часа — лимит GitHub Actions на джобу
    permissions:
      contents: write      # нужно, чтобы скрипт мог коммитить транскрипты по ходу работы

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Configure git for auto-commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GIT_AUTOCOMMIT: "1"
        run: |
          set -e
          if [ "${{ inputs.links_file }}" = "all" ]; then
            for f in links/*.txt; do
              course="$(basename "$f" .txt)"
              echo "=== Курс: $course ==="
              python process.py "$f" "transcripts/$course"
            done
          else
            course="$(basename "${{ inputs.links_file }}" .txt)"
            python process.py "links/${{ inputs.links_file }}" "transcripts/$course"
          fi
